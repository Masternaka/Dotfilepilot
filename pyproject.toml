[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dotfilepilot"
version = "0.1.0.dev0"
description = "Gestionnaire de dotfiles pour Arch Linux, Debian et Fedora"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dotfilepilot = "dotfilepilot.cli:main"

[tool.setuptools.packages.find]
include = ["dotfilepilot*"]

[tool.setuptools.package-data]
dotfilepilot = ["assets/icons/*.svg", "assets/icons/*.png", "assets/icons/*/*.png"]
